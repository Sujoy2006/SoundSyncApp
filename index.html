<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundSync | Audio Reactive Orb</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%2338bdf8%22 stroke-width=%228%22 stroke-dasharray=%2210 5%22/><circle cx=%2250%22 cy=%2250%22 r=%2225%22 fill=%22%230ea5e9%22/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="canvas-container"></div>

    <!-- Hidden audio element to keep browser stream active and routed -->
    <audio id="remote-audio" autoplay style="display:none;"></audio>

    <div style="position: absolute; top: 20px; right: 80px; z-index: 20;">
        <button id="settings-btn" class="glass-panel"
            style="padding: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>
    </div>

    <div style="position: absolute; top: 20px; right: 20px; z-index: 20;">
        <button id="fullscreen-btn" class="glass-panel"
            style="padding: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
            <svg id="fullscreen-icon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                </path>
            </svg>
        </button>
    </div>

    <div id="settings-menu" class="glass-panel"
        style="position: absolute; top: 70px; right: 20px; z-index: 20; display: none; flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px; border-radius: 16px; min-width: 220px;">
        <div style="width: 100%;">
            <h3
                style="margin: 0 0 6px 0; font-size: 0.85rem; color: rgba(255,255,255,0.7); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">
                Color Palette</h3>
            <select id="color-palette-select" class="custom-select">
                <option value="cyber-glow-obsidian">Cyber-Glow Obsidian</option>
                <option value="matrix-monolith">The Matrix Monolith</option>
                <option value="midnight-supernova">Midnight Supernova</option>
                <option value="crimson-horizon">Crimson Horizon</option>
                <option value="cybernetic-amber">Cybernetic Amber</option>
                <option value="neon-glacier">Neon Glacier</option>
                <option value="toxic-ultraviolet">Toxic Ultraviolet</option>
                <option value="molten-copper">Molten Copper</option>
                <option value="cyberpunk-cobalt">Cyberpunk Cobalt</option>
                <option value="solar-eclipse">Solar Eclipse</option>
                <option value="acid-venom">Acid Venom</option>
                <option value="royal-amethyst">Royal Amethyst</option>
                <option value="custom">Custom...</option>
            </select>
        </div>

        <div id="custom-color-builder"
            style="width: 100%; display: none; flex-direction: column; gap: 8px; margin-top: 8px;">
            <span
                style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Custom
                Colors (Max 5)</span>
            <div id="custom-colors-container" style="display: flex; flex-direction: column;"></div>
            <button id="add-color-btn" class="add-color-btn">+ Add Color</button>
        </div>

        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
            <span
                style="font-size: 0.85rem; color: rgba(255,255,255,0.7); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Auto-Cycle</span>
            <label class="switch">
                <input type="checkbox" id="auto-cycle-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
            <span
                style="font-size: 0.85rem; color: rgba(255,255,255,0.7); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Inner
                Audio (Tab)</span>
            <label class="switch">
                <input type="checkbox" id="inner-audio-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div style="width: 100%; flex-direction: column; gap: 4px; margin-top: 4px; display: flex;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Cycle
                    Speed</span>
                <span id="speed-display" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">1.0x</span>
            </div>
            <input type="range" id="cycle-speed-slider" min="0.1" max="5.0" step="0.1" value="1.0"
                class="custom-slider">
        </div>

        <hr style="width: 100%; border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 4px 0;">

        <div style="width: 100%; flex-direction: column; gap: 4px; display: flex;">
            <h3
                style="margin: 0 0 4px 0; font-size: 0.85rem; color: rgba(255,255,255,0.7); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">
                Particle Controls</h3>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Size</span>
                <span id="size-display" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">1.0x</span>
            </div>
            <input type="range" id="size-slider" min="0.1" max="3.0" step="0.1" value="1.0" class="custom-slider">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                <span
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Reactivity</span>
                <span id="reactivity-display" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">1.0x</span>
            </div>
            <input type="range" id="reactivity-slider" min="0.1" max="3.0" step="0.1" value="1.0" class="custom-slider">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                <span
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Glow</span>
                <span id="glow-display" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">1.0x</span>
            </div>
            <input type="range" id="glow-slider" min="0.0" max="3.0" step="0.1" value="1.0" class="custom-slider">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                <span
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Rotation
                    Speed</span>
                <span id="rotation-display" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">1.0x</span>
            </div>
            <input type="range" id="rotation-slider" min="0.0" max="3.0" step="0.1" value="1.0" class="custom-slider">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                <span
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Anim
                    Speed</span>
                <span id="anim-speed-display" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">1.0x</span>
            </div>
            <input type="range" id="anim-speed-slider" min="0.1" max="5.0" step="0.1" value="1.0" class="custom-slider">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                <span
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Chaos
                    Jump</span>
                <span id="chaos-display" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">1.0x</span>
            </div>
            <input type="range" id="chaos-slider" min="0.1" max="5.0" step="0.1" value="1.0" class="custom-slider">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                <span
                    style="font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px;">Density</span>
                <span id="density-display" style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">100%</span>
            </div>
            <input type="range" id="density-slider" min="10" max="100" step="10" value="100" class="custom-slider">
        </div>
    </div>

    <div id="ui-container"
        style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 16px;">
        <button id="sync-btn" class="glass-panel">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
            <span id="sync-btn-text">Start Sync</span>
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
